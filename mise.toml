[tools]
node = "26"
pnpm = "12"

[tasks.setup]
description = "Install dependencies"
run = "pnpm install"

[tasks.build]
description = "Build the extension into .output/chrome-mv3"
run = "pnpm build"

[tasks.lint]
description = "Check formatting and lint rules with Biome"
run = "pnpm lint"

[tasks.format]
description = "Fix formatting and safe lint issues with Biome"
run = "pnpm format"

[tasks.typecheck]
description = "Type-check with TypeScript"
run = "pnpm compile"

[tasks.test]
description = "Run the unit tests"
run = "pnpm test"

[tasks.site-data]
description = "Update the data from Apple's password-manager-resources in src/lib/site-data"
run = """
set -eu
dir=src/lib/site-data
base=https://raw.githubusercontent.com/apple/password-manager-resources/main
curl -fsSL "$base/quirks/password-rules.json" -o "$dir/apple-password-rules.json"
curl -fsSL "$base/quirks/shared-credentials.json" -o "$dir/apple-shared-credentials.json"
curl -fsSL "$base/LICENSE.md" -o "$dir/LICENSE.apple.md"
pnpm biome format --write "$dir"
"""

[tasks.corpus]
description = "Score field detection on DuckDuckGo's annotated forms, downloaded into .cache/form-corpus"
run = """
set -eu
dir=.cache/form-corpus
commit=e456864774efa83446790277a746f347e7cca772
if [ "$(git -C "$dir" rev-parse HEAD 2>/dev/null || true)" != "$commit" ]; then
  rm -rf "$dir"
  git init -q "$dir"
  git -C "$dir" remote add origin https://github.com/duckduckgo/duckduckgo-autofill.git
  git -C "$dir" sparse-checkout set --no-cone /test-forms/
  git -C "$dir" fetch -q --depth 1 --filter=blob:none origin "$commit"
  git -C "$dir" checkout -q FETCH_HEAD
fi
KEYWARD_FORM_CORPUS="$dir/test-forms" pnpm vitest run --silent=false src/content/form-corpus.test.ts
"""

[tasks.check]
description = "Run lint, type check and tests"
depends = ["lint", "typecheck", "test"]
