<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 824 824">
  <title>Apple Passwords</title>
  <!-- Traced after the Passwords app icon: three upright keys on a dark tile. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#202020"/>
      <stop offset="1" stop-color="#0c0c0c"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ffd24d"/>
      <stop offset="1" stop-color="#f2b82b"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#3bd65c"/>
      <stop offset="1" stop-color="#18ad3c"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#4092f4"/>
      <stop offset="1" stop-color="#226cdc"/>
    </linearGradient>
    <!-- A soft glow in the key's own colour, as the app icon has. -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur"/>
      <feComponentTransfer in="blur" result="faint">
        <feFuncA type="linear" slope="0.55"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="faint"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="yellow-bow"><circle cx="234" cy="278" r="130"/></clipPath>
    <clipPath id="green-bow"><circle cx="406" cy="280" r="134"/></clipPath>
  </defs>

  <rect width="824" height="824" rx="185" fill="url(#tile)"/>
  <rect x="3" y="3" width="818" height="818" rx="182" fill="none" stroke="#fff" stroke-opacity="0.08" stroke-width="6"/>

  <!-- Yellow key: a square bit on the right of the shaft. -->
  <g filter="url(#glow)">
  <g fill="url(#yellow)">
    <rect x="212" y="380" width="58" height="302" rx="29"/>
    <rect x="262" y="488" width="60" height="140" rx="10"/>
    <circle cx="234" cy="278" r="130"/>
  </g>
  <rect x="270" y="494" width="18" height="128" rx="6" fill="#c98f1c" fill-opacity="0.35"/>
  <circle cx="243" cy="230" r="35" fill="#151515"/>
  </g>

  <!-- Green key: a saw-toothed blade that ends in a point. -->
  <g filter="url(#glow)">
  <path fill="url(#green)" stroke="url(#green)" stroke-width="10" stroke-linejoin="round"
        d="M362 380V640L407 680L481 606V578L455 550L481 522L455 494L481 466L448 432V380Z"/>
  <rect x="402" y="428" width="16" height="236" rx="8" fill="#0f8a2c" fill-opacity="0.45"/>
  <circle cx="406" cy="280" r="134" fill="url(#green)"/>
  <circle cx="406" cy="280" r="134" fill="#6fd44e" clip-path="url(#yellow-bow)"/>
  <circle cx="412" cy="228" r="35" fill="#151515"/>
  </g>

  <!-- Blue key: a collar under the bow and two round notches in the blade. -->
  <g filter="url(#glow)">
  <path fill="url(#blue)"
        d="M537 430H625V496A14 14 0 0 0 625 524V540A22 22 0 0 0 625 584V638L589 682H560A23 23 0 0 1 537 659Z"/>
  <rect x="522" y="396" width="116" height="44" rx="10" fill="url(#blue)"/>
  <rect x="571" y="446" width="18" height="232" rx="9" fill="#174fae" fill-opacity="0.45"/>
  <circle cx="580" cy="279" r="138" fill="url(#blue)"/>
  <circle cx="580" cy="279" r="138" fill="#2f9ae8" clip-path="url(#green-bow)"/>
  <circle cx="580" cy="228" r="36" fill="#151515"/>
  </g>
</svg>
